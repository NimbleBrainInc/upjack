[project]
name = "upjack-todo"
version = "1.0.0"
description = "AI-native todo list for managing tasks, projects, and priorities"
requires-python = ">=3.13"
dependencies = [
    "upjack[mcp]>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
