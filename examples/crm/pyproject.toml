[project]
name = "upjack-crm"
version = "1.0.0"
description = "AI-native CRM for managing contacts, companies, deals, and pipelines"
requires-python = ">=3.13"
dependencies = [
    "upjack[mcp]>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
