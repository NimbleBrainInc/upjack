name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lib:
    name: Library checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: lib/python
        run: uv sync --group dev

      - name: Format check
        working-directory: lib/python
        run: uv run ruff format --check src/ tests/

      - name: Lint
        working-directory: lib/python
        run: uv run ruff check src/ tests/

      - name: Type check
        working-directory: lib/python
        run: uv run ty check src/

      - name: Tests
        working-directory: lib/python
        run: uv run pytest tests/ -v --cov=upjack --cov-report=xml

      - name: Upload coverage
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: lib/python/coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  lib-ts:
    name: TypeScript library checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: lib/typescript
        run: npm install

      - name: Format check
        working-directory: lib/typescript
        run: npx biome format src/ tests/

      - name: Lint
        working-directory: lib/typescript
        run: npx biome lint src/ tests/

      - name: Type check
        working-directory: lib/typescript
        run: npx tsc --noEmit

      - name: Tests
        working-directory: lib/typescript
        run: npx vitest run

  schemas:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        working-directory: schemas
        run: npm install

      - name: Validate schemas
        working-directory: schemas
        run: make validate

  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build
        working-directory: website
        run: npm run build
