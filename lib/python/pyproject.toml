[project]
name = "upjack"
version = "0.2.0"
description = "Schema-driven entity management for AI-native applications"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.13"
authors = [
    { name = "NimbleBrain Inc", email = "hello@nimblebrain.ai" },
]
keywords = ["nimblebrain", "upjack", "mcp", "agent", "ai", "declarative", "entity-management", "schema-driven", "json-schema"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jsonschema>=4.0",
    "referencing>=0.35.0",
    "python-ulid>=3.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/upjack"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "fastmcp>=3.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.13.1",
    "ty>=0.0.1a14",
]
e2e = [
    "mcp>=1.3.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
upjack = "upjack.cli:main"

[project.urls]
Homepage = "https://github.com/NimbleBrainInc/upjack"
Repository = "https://github.com/NimbleBrainInc/upjack.git"
Issues = "https://github.com/NimbleBrainInc/upjack/issues"
