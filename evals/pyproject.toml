[project]
name = "upjack-evals"
version = "0.1.0"
description = "Eval framework for the upjack-app-builder skill"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "upjack[mcp]",
    "jsonschema>=4.0",
    "referencing>=0.35.0",
]

[tool.uv.sources]
upjack = { path = "../lib/python", editable = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long - handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.1",
    "ty>=0.0.1a14",
]
